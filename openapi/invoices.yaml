openapi: 3.0.3
info: { title: ShopLab Invoices, version: 1.0.0 }
paths:
  /invoices:
    get:
      operationId: listInvoices
      description: Internal, newest first. Requires the x-internal-key header; the gateway lets staff and admin reach it.
      parameters:
        - { name: x-internal-key, in: header, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invoice' } } } } }
        '401': { description: Missing or wrong key }
  /invoices/order/{orderId}:
    get:
      operationId: getInvoiceForOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: x-internal-key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '401': { description: Missing or wrong key }
        '404': { description: No invoice for that order }
  /invoices/{id}/pdf:
    get:
      operationId: getInvoicePdf
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: x-internal-key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: A one-page PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { description: Missing or wrong key }
        '404': { description: Not found }
  /invoices/{id}/credit-notes:
    post:
      operationId: createCreditNote
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: x-internal-key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount], properties: { amount: { type: integer, minimum: 1 }, reason: { type: string } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { description: Invalid amount or reason }
        '401': { description: Missing or wrong key }
        '404': { description: Not found }
        '409': { description: The credits would add up to more than the invoice total }
components:
  schemas:
    Invoice:
      type: object
      required: [id, orderId, customerEmail, customerName, subtotal, tax, total, currency]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        customerEmail: { type: string, format: email }
        customerName: { type: string }
        subtotal: { type: integer, description: minor units }
        tax: { type: integer, description: minor units }
        total: { type: integer, description: minor units }
        currency: { type: string }
        number: { type: string, description: 'Human-readable number, INV-000123' }
        credited: { type: integer, description: minor units credited so far }
