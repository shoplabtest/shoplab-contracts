openapi: 3.0.3
info: { title: ShopLab Cart API, version: 1.0.0 }
paths:
  /cart:
    get:
      operationId: getCart
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /cart/items:
    post:
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [productId, quantity], properties: { productId: { type: string }, quantity: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /cart/coupon:
    post:
      operationId: applyCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '422': { description: Invalid coupon }
  /cart/items/{productId}:
    patch:
      operationId: updateCartItem
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 0, description: '0 removes the line' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { description: Line not found }
    delete:
      operationId: removeCartItem
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { description: Line not found }
  /cart/merge:
    post:
      operationId: mergeCart
      description: Merge a guest cart into the logged-in user's cart after login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [guestCartId], properties: { guestCartId: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '401': { description: Not logged in }
  /cart/checkout:
    post:
      operationId: checkoutCart
      responses:
        '202': { description: Accepted, emits cart.checked_out, content: { application/json: { schema: { type: object, properties: { cartId: { type: string } } } } } }
        '409': { description: Cart is empty }
components:
  schemas:
    CartLine:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: string }
        quantity: { type: integer }
        unitPrice: { type: integer, description: 'minor units, snapshot at add time' }
        latestUnitPrice: { type: integer, description: 'present when the catalog price has changed since the snapshot' }
    Cart:
      type: object
      required: [id, lines, total, currency]
      properties:
        id: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        coupon: { type: string, nullable: true }
        total: { type: integer, description: minor units }
        currency: { type: string }
